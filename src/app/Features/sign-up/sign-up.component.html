<section class="col-11 col-md-8 col-lg-5 mx-auto my-5 ">
    <!-- Using a Bootstrap Card for a clean, elevated container -->
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4 p-sm-5">
            
            <!-- Upgraded Header -->
            <div class="text-center mb-4">
                <h2 class="fw-bold text-success mb-1">{{ 'signUp.title' | translate }}</h2>
                <p class="text-muted">{{ 'signUp.subtitle' | translate }}</p>
            </div>
            
            <form [formGroup]="signUpForm" (ngSubmit)="submitForm()">

                <!-- Name -->
                <div class="mb-3">
                    <app-input [control]="signUpForm.get('name')" [typeInput]="'text'" [idInput]="'name'" [lableInput]="'auth.fullName' | translate"></app-input>
    
                </div>
                    
                <!-- Email -->
                <div class="mb-3">
                    <app-input [control]="signUpForm.get('email')" [typeInput]="'email'" [idInput]="'email'" [lableInput]="'auth.emailAddress' | translate"></app-input>
                </div>
                
                <!-- Password -->
                <div class="mb-3">
                    <app-input [control]="signUpForm.get('password')" [typeInput]="'password'" [idInput]="'password'" [lableInput]="'auth.password' | translate">
                        {{ 'signUp.helper' | translate }}
                    </app-input>
                </div>
                
                <!-- Confirm Password -->
                <div class="mb-3">
                    <app-input [control]="signUpForm.get('rePassword')" [typeInput]="'password'" [idInput]="'rePassword'" [lableInput]="'auth.confirmPassword' | translate"></app-input>
                </div>
                    
                <!-- Phone -->
                <div class="mb-4">
                    <app-input [control]="signUpForm.get('phone')" [typeInput]="'tel'" [idInput]="'phone'" [lableInput]="'auth.phone' | translate">
                        {{ 'signUp.phoneHelper' | translate }}
                    </app-input>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm" [disabled]="isLoading">
                    @if (isLoading) {
                        <i class="fas fa-spinner fa-spin me-2"></i> {{ 'signUp.creating' | translate }}
                    } @else {
                        {{ 'signUp.submit' | translate }}
                    }
                </button>
                
                <!-- Error Message-->
                @if(msgError) {
                    <div class="alert alert-danger d-flex align-items-center mt-4 mb-0 py-2 shadow-sm" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <div>{{ msgError }}</div>
                    </div>
                }

            </form>
        </div>
    </div>
</section>
