<section class="col-11 col-md-8 col-lg-5 mx-auto my-5 ">
    <!-- Using a Bootstrap Card for a clean, elevated container -->
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4 p-sm-5">
            
            <!-- Upgraded Header -->
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary mb-1">Register Now</h2>
                <p class="text-muted">Create an account to get started</p>
            </div>
            
            <form [formGroup]="signUpForm" (ngSubmit)="submitForm()">

                <!-- Name -->
                <div class="mb-3">
                    <app-input [control]="signUpForm.get('name')" [typeInput]="'text'" [idInput]="'name'" [lableInput]="'Name'"></app-input>
    
                </div>
                    
                <!-- Email -->
                <div class="mb-3">
                    <app-input [control]="signUpForm.get('email')" [typeInput]="'email'" [idInput]="'email'" [lableInput]="'Email'"></app-input>
                </div>
                
                <!-- Password -->
                <div class="mb-3">
                    <app-input [control]="signUpForm.get('password')" [typeInput]="'password'" [idInput]="'password'" [lableInput]="'Password'">
                        Must be at least 6 characters long.
                    </app-input>
                </div>
                
                <!-- Confirm Password -->
                <div class="mb-3">
                    <app-input [control]="signUpForm.get('rePassword')" [typeInput]="'password'" [idInput]="'rePassword'" [lableInput]="'Confirm Password'"></app-input>
                </div>
                    
                <!-- Phone -->
                <div class="mb-4">
                    <app-input [control]="signUpForm.get('phone')" [typeInput]="'tel'" [idInput]="'phone'" [lableInput]="'Phone'">
                        Please enter a valid Egyptian number.
                    </app-input>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm" [disabled]="isLoading">
                    @if (isLoading) {
                        <i class="fas fa-spinner fa-spin me-2"></i> Creating Account...
                    } @else {
                        Register
                    }
                </button>
                
                <!-- Error Message-->
                @if(msgError) {
                    <div class="alert alert-danger d-flex align-items-center mt-4 mb-0 py-2 shadow-sm" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <div>{{ msgError }}</div>
                    </div>
                }

            </form>
        </div>
    </div>
</section>
